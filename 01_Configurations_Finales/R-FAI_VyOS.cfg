# ==============================================================================
# CONFIGURATION FINALE DURCIE : R-FAI (Routeur Bordure Opérateur - VyOS 2026.03)
# Politique CamTrust Bank (M1) & Référentiel NSA (Sections 3.1 & 3.3)
# NOTE : Tous les secrets et mots de passe sont remplacés par <masqué>
# ==============================================================================

# [M1-ID / NSA 3.1.1] Identification de l'équipement
set system host-name R-FAI

# [M1-ACC-01 / NSA 3.1.2] Compte local de secours et suppression du compte par défaut 'vyos'
set system login user secours authentication plaintext-password '<masqué>'
delete system login user vyos

# [M1-AAA-01 / NSA 3.1.3] Authentification centralisée RADIUS vers SRV-ADMIN
set system login radius server 10.10.99.20 key '<masqué>'

# [M1-TIME-01 / NSA 3.3.3] Fuseau horaire local WAT et synchronisation NTP
set system time-zone Africa/Douala
set service ntp server 10.10.99.20

# [M1-LOG-01 / NSA 3.3.4] Centralisation Syslog (syntaxe VyOS 2026.03 circinus)
set system syslog remote 10.10.99.20 facility all level info

# [M1-SRV-01 / NSA 3.1.4] Restriction de l'écoute SSH uniquement sur l'interface interne
set service ssh listen-address 198.51.100.1

# [M1-EDGE-01 / NSA 3.3.5] Activation de uRPF en mode strict sur lien point-à-point
set firewall global-options source-validation strict

# [M1-FW-01 / NSA 3.3.1] Filtrage du plan de contrôle (IPv4 Input Filter - Default Drop)
set firewall ipv4 input filter default-action drop
set firewall ipv4 input filter rule 10 action accept
set firewall ipv4 input filter rule 10 state established
set firewall ipv4 input filter rule 10 state related
set firewall ipv4 input filter rule 20 action accept
set firewall ipv4 input filter rule 20 protocol icmp
set firewall ipv4 input filter rule 30 action accept
set firewall ipv4 input filter rule 30 protocol tcp
set firewall ipv4 input filter rule 30 source address 10.10.99.0/24
set firewall ipv4 input filter rule 30 destination port 22
