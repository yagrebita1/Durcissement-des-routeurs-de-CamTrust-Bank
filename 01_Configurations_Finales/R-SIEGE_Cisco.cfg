! ==============================================================================
! CONFIGURATION FINALE DURCIE : R-SIEGE (Routeur Central Siège - Cisco IOSv)
! Politique CamTrust Bank (M1) & Référentiel NSA (Sections 3.1 & 3.3)
! NOTE : Tous les secrets et mots de passe sont remplacés par <masqué>
! ==============================================================================

! [M1-ID / NSA 3.1.1] Identification et bannière légale dissuasive
hostname R-SIEGE
ip domain name camtrust.lab
banner login ^
Acces reserve au personnel autorise de CamTrust Bank. Toute connexion est journalisee.
^

! [M1-ACC-01 / NSA 3.1.2] Chiffrement fort des secrets locaux et compte de secours
service password-encryption
enable secret <masqué>
username secours privilege 15 secret <masqué>

! [M1-AAA-01 / NSA 3.1.3] Authentification, autorisation et traçabilité AAA via RADIUS
aaa new-model
aaa authentication login default group radius local
aaa authorization exec default group radius local
aaa accounting exec default start-stop group radius
aaa session-id common
!
radius server SRV-ADMIN
 address ipv4 10.10.99.20 auth-port 1812 acct-port 1813
 key <masqué>

! [M1-SRV-01 / NSA 3.1.4] Désactivation des services non sécurisés et durcissement SSHv2
no ip http server
no ip http secure-server
no cdp run
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ip access-list standard ADMIN-SOURCES
 permit 10.10.99.0 0.0.0.255
 deny any log
!
line vty 0 4
 access-class ADMIN-SOURCES in
 transport input ssh
 exec-timeout 5 0

! [M1-MON-01 / NSA 3.3.2] Supervision chiffrée SNMPv3 (authPriv)
snmp-server group GRP-ADMIN v3 priv
snmp-server user snmpadmin GRP-ADMIN v3 auth sha <masqué> priv aes 128 <masqué>

! [M1-TIME-01 / NSA 3.3.3] Synchronisation NTP et fuseau horaire WAT
clock timezone WAT 1 0
ntp server 10.10.99.20

! [M1-LOG-01 / NSA 3.3.4] Journalisation Syslog centralisée et audit des commandes (Archive)
logging host 10.10.99.20
logging trap informational
service timestamps log datetime localtime show-timezone
archive
 log config
  logging enable
  notify syslog contenttype plaintext
  hidekeys

! [M1-EDGE-01 / NSA 3.3.5] Filtrage anti-usurpation (uRPF strict) et ACL anti-bogons sur WAN
ip access-list extended WAN-ANTI-USURPATION
 5 permit ip 198.51.100.0 0.0.0.3 any
 10 deny ip 10.0.0.0 0.255.255.255 any log
 20 deny ip 172.16.0.0 0.15.255.255 any log
 30 deny ip 192.168.0.0 0.0.255.255 any log
 40 deny ip 127.0.0.0 0.255.255.255 any log
 50 deny ip 169.254.0.0 0.0.255.255 any log
 60 deny ip 224.0.0.0 31.255.255.255 any log
 70 deny ip 198.51.100.0 0.0.0.255 any log
 80 permit ip any any
!
interface GigabitEthernet0/1
 ip address 198.51.100.2 255.255.255.252
 ip access-group WAN-ANTI-USURPATION in
 ip verify unicast source reachable-via rx
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no cdp enable
